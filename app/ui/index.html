<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lanyell</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      background: #f5f5f7; color: #222;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 32px 24px; gap: 20px;
      user-select: none;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .hint { font-size: 13px; color: #999; }

    /* the switch */
    .switch-wrap {
      display: flex; align-items: center; gap: 12px;
      background: #fff; padding: 16px 22px; border-radius: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .switch {
      width: 52px; height: 30px; border-radius: 15px; background: #ccc;
      position: relative; cursor: pointer; transition: background .2s;
    }
    .switch::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 24px; height: 24px; border-radius: 50%; background: #fff;
      transition: left .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
    }
    .switch.on { background: #34c759; }
    .switch.on::after { left: 25px; }
    .switch-label { font-size: 15px; min-width: 52px; }

    /* address + QR (hidden until the server is on) */
    .panel {
      display: none; flex-direction: column; align-items: center; gap: 14px;
      width: 100%; max-width: 340px;
      background: #fff; padding: 22px; border-radius: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .panel.show { display: flex; }
    .url {
      font-size: 15px; color: #4a90d9; word-break: break-all;
      cursor: pointer; user-select: text; text-align: center;
    }
    .url:hover { text-decoration: underline; }
    .url-hint { font-size: 12px; color: #999; }
    #qr { width: 180px; height: 180px; padding: 8px; background: #fff; border: 1px solid #eee; border-radius: 10px; }

    /* port input sits left of the switch in the same card; editable only
       while the server is off */
    .port-field {
      display: flex; align-items: center; gap: 8px;
    }
    .port-field label { font-size: 14px; color: #555; }
    .port-field input {
      width: 78px; padding: 8px 10px; font-size: 15px;
      border: 1px solid #ddd; border-radius: 8px; outline: none; text-align: center;
    }
    .port-field input:focus { border-color: #4a90d9; }
    .port-field input:disabled { background: #f2f2f2; color: #999; cursor: not-allowed; }

    .error {
      display: none; max-width: 340px; padding: 12px 16px;
      background: #ffeceb; color: #c0392b; border-radius: 10px;
      font-size: 13px; text-align: center; user-select: text;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <h1>lanyell</h1>
  <div class="hint">Flip the switch to start the LAN message board</div>

  <div class="switch-wrap">
    <div class="port-field">
      <label for="port">Port</label>
      <input type="number" id="port" value="3000" min="1" max="65535" step="1" />
    </div>
    <div class="switch" id="switch"></div>
    <span class="switch-label" id="switchLabel">Off</span>
  </div>

  <div class="error" id="error"></div>

  <div class="panel" id="panel">
    <div class="url" id="url" title="Click to copy"></div>
    <div class="url-hint">Scan with your phone, or click the address to copy</div>
    <canvas id="qr"></canvas>
  </div>

  <script src="./bundle.js"></script>
</body>
</html>
