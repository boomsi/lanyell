# Build the desktop app on tag push and attach artifacts to a GitHub Release.
# macOS runner -> lanyell.dmg, Windows runner -> .exe (nsis installer).
# The npm CLI package stays manual (npm publish is account-bound).

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            artifact: src-tauri/target/release/bundle/macos/lanyell.dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            artifact: src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install app deps
        run: npm install

      - name: Build sidecar
        run: node build-sidecar.js ${{ matrix.triple }}

      - name: Build UI
        run: npm run build:ui

      - name: Build app (macos)
        if: runner.os == 'macOS'
        # Only bundle the .app (Tauri's dmg script needs a GUI session);
        # create the dmg ourselves with hdiutil, same as the local script.
        run: |
          npx tauri build --bundles app
          hdiutil create -volname lanyell -srcfolder src-tauri/target/release/bundle/macos/lanyell.app -ov -format UDZO src-tauri/target/release/bundle/macos/lanyell.dmg

      - name: Build app (windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanyell-${{ runner.os }}
          path: app/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename Windows installer
        run: |
          cd artifacts
          for f in *.exe; do
            [ -e "$f" ] || continue
            mv "$f" "lanyell-setup-${GITHUB_REF_NAME}.exe"
          done
          ls -la

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: artifacts/*
