<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lanyell</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f5f5f7; color: #222; }
    .wrap { width: 100%; max-width: 800px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
    .status { font-size: 12px; color: #999; }
    form { display: flex; gap: 8px; margin: 16px 0; align-items: flex-end; }
    /* textarea auto-grow: single line by default, expands with content.
       JS only sets height = scrollHeight; the CSS max-height caps it at ~4 lines,
       so the box-sizing border-box padding is preserved at every row count.
       --input-base is the reset height autoGrow returns to (1 row desktop,
       2 rows on phones). */
    textarea { flex: 1; padding: 11px 36px 11px 14px; font-size: 16px; line-height: 1.5; border: 1px solid #ddd; border-radius: 10px; outline: none; background: #fff; resize: none; overflow-y: auto; height: var(--input-base, 44px); max-height: 216px; --input-base: 44px; }
    textarea:focus { border-color: #4a90d9; }
    /* input wrapper + clear button inside the textarea's right side */
    .input-wrap { position: relative; flex: 1; display: flex; }
    .input-wrap textarea { width: 100%; }
    .clear-btn { position: absolute; right: 8px; bottom: 12px; width: 22px; height: 22px; padding: 0; border: none; border-radius: 50%; background: #ccc; color: #fff; font-size: 14px; cursor: pointer; display: none; align-items: center; justify-content: center; }
    .clear-btn.show { display: flex; }
    .clear-btn:hover { background: #999; }
    button { padding: 11px 18px; font-size: 16px; border: none; border-radius: 10px; background: #4a90d9; color: #fff; cursor: pointer; }
    button:disabled { background: #aaa; }
    /* the paste button is secondary, so it shares the input's light look */
    .btn-paste { background: #fff; color: #4a90d9; border: 1px solid #ddd; }
    .btn-paste:hover { border-color: #4a90d9; }
    .btn-row { display: flex; gap: 8px; align-items: stretch; }
    .btn-row button { flex: 1; }
    /* the switch matches the buttons' height so the row looks balanced */
    .btn-row .switch { flex: none; margin-left: 4px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; cursor: pointer; }
    /* narrow screens (phones): stack the textarea above its own button row so
       nothing is cramped on one line; default the input to two rows (72px =
       2 lines * 24px + 22px padding + 2px border). Item action buttons wrap
       onto their own row below time/device. */
    @media (max-width: 768px) {
      form { flex-direction: column; align-items: stretch; }
      textarea { height: 72px; --input-base: 72px; }
      .btn-row { width: 100%; }
      .meta { flex-wrap: wrap; }
      .meta .copy { margin-left: 0; }
      .meta .btn-group { flex-basis: 100%; margin-top: 4px; }
      /* tap-friendly: enlarge the action buttons on phones */
      .meta .btn-group .copy,
      .meta .btn-group .delete,
      .meta .btn-group .fold-toggle { padding: 8px 14px; font-size: 14px; min-height: 36px; }
    }
    ul { list-style: none; margin: 0; padding: 0; }
    li { background: #fff; padding: 11px 14px; border-radius: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.06); word-break: break-word; }
    .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .time, .device { color: #999; font-size: 12px; }
    .copy { padding: 3px 10px; font-size: 12px; line-height: 1.4; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #555; cursor: pointer; transition: all .15s; }
    .copy:hover { border-color: #4a90d9; color: #4a90d9; }
    .copy.copied { background: #34c759; color: #fff; border-color: #34c759; }
    .copy.failed { background: #ff3b30; color: #fff; border-color: #ff3b30; }
    .delete { padding: 3px 10px; font-size: 12px; line-height: 1.4; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #ff3b30; cursor: pointer; transition: all .15s; }
    .delete:hover { border-color: #ff3b30; background: #ff3b30; color: #fff; }
    .content { display: block; white-space: pre-wrap; }
    /* collapse mode: only content that actually overflows gets clipped at
       222px. Keep pre-wrap so the original formatting (newlines, spacing) is
       preserved exactly. No ellipsis — line-clamp would break the format. */
    body.fold-on .content.collapsible.overflows { max-height: 222px; overflow: hidden; }
    body.fold-on .content.collapsible.overflows.expanded { max-height: none; }
    /* expand/collapse toggle in the meta row, right-aligned with Copy/Delete.
       Shown only for overflowing items while fold is on. */
    .fold-toggle { display: none; padding: 3px 10px; font-size: 12px; line-height: 1.4; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #4a90d9; cursor: pointer; user-select: none; transition: all .15s; }
    .fold-toggle:hover { border-color: #4a90d9; }
    body.fold-on .fold-toggle.show { display: inline-block; }
    /* while folded (overflowing + not expanded) the toggle pulses strongly
       (color + glow) to signal the collapsed state */
    .fold-toggle.collapsed { animation: fold-pulse 1s ease-in-out infinite; }
    @keyframes fold-pulse {
      0%, 100% { border-color: #4a90d9; box-shadow: 0 0 0 0 rgba(74,144,217,0); background: #fff; }
      50%      { border-color: #2a6fc0; box-shadow: 0 0 8px 2px rgba(74,144,217,.55); background: #eaf2fb; }
    }
    /* the fold switch: a pill toggle on the right of the button row,
       sized to match the buttons' height */
    .switch { font-size: 14px; color: #555; white-space: nowrap; user-select: none; }
    .switch:hover { border-color: #4a90d9; }
    .switch-track { width: 40px; height: 24px; border-radius: 12px; background: #ccc; position: relative; transition: background .15s; flex: none; }
    .switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
    .switch.on { color: #34c759; }
    .switch.on .switch-track { background: #34c759; }
    .switch.on .switch-track::after { left: 19px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>lanyell</h1>
    <span class="status" id="status">connecting…</span>
    <form id="f">
      <div class="input-wrap">
        <textarea id="m" placeholder="Type a message, Enter to send…" autocomplete="off" autofocus rows="1"></textarea>
        <button type="button" class="clear-btn" id="clear" title="Clear">×</button>
      </div>
      <div class="btn-row">
        <button type="button" class="btn-paste" id="paste">Paste</button>
        <button type="submit">Send</button>
        <div class="switch on" id="foldSwitch" title="Fold long messages">
          <span>Fold</span>
          <div class="switch-track"></div>
        </div>
      </div>
    </form>
    <ul id="list"></ul>
  </div>
  <script>
    const list = document.getElementById("list");
    const form = document.getElementById("f");
    const input = document.getElementById("m");
    const status = document.getElementById("status");

    // Auto-grow: reset to baseline then set height = scrollHeight. The CSS
    // max-height caps growth at ~4 lines and keeps overflow internal, so padding
    // never disappears (do NOT recompute a JS ceiling — that drifts and eats padding).
    function autoGrow() {
      // reset to the CSS base (1 row desktop / 2 rows phone) then grow to content
      const base = getComputedStyle(input).getPropertyValue("--input-base").trim() || "44px";
      input.style.height = base;
      input.style.height = input.scrollHeight + "px";
    }
    input.addEventListener("input", autoGrow);

    // Clear button inside the input: shown only when there is text; clears
    // and collapses the height back to the base.
    const clearBtn = document.getElementById("clear");
    function syncClearBtn() {
      clearBtn.classList.toggle("show", input.value.length > 0);
    }
    input.addEventListener("input", syncClearBtn);
    clearBtn.addEventListener("click", function () {
      input.value = "";
      autoGrow();
      syncClearBtn();
      input.focus();
    });

    // Enter to send, Shift+Enter for a newline
    input.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) {
        ev.preventDefault();
        form.requestSubmit();
      }
    });

    // Detect real OS: prefer userAgentData (new API, Chromium), fall back to UA string
    function detectOs() {
      if (navigator.userAgentData && navigator.userAgentData.platform) {
        const p = navigator.userAgentData.platform.toLowerCase();
        if (p === "ios") return "iOS";
        if (p === "android") return "Android";
        if (p === "macos") return "macOS";
        if (p === "windows") return "Windows";
        if (p === "linux") return "Linux";
      }
      const ua = navigator.userAgent;
      if (/iPhone|iPad|iPod/.test(ua)) return "iOS";
      if (/Android/.test(ua)) return "Android";
      if (/Mac OS X|Macintosh/.test(ua)) return "macOS";
      if (/Windows/.test(ua)) return "Windows";
      if (/Linux/.test(ua)) return "Linux";
      return "Web";
    }

    // Device id: OS prefix (real system) + a localStorage-persisted random segment
    // (tells browser instances apart). Browsers expose no MAC/hardware id, so this
    // is the environment ceiling.
    const DEVICE_KEY = "lanyell_device_id";
    function getDeviceId() {
      const os = detectOs();
      const rand = (crypto.randomUUID ? crypto.randomUUID() : "id" + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 12);
      const id = os + "-" + rand;
      try {
        const stored = localStorage.getItem(DEVICE_KEY);
        if (stored) return stored;
        localStorage.setItem(DEVICE_KEY, id);
        return id;
      } catch (e) {
        // localStorage unavailable (private mode, etc.): keep an in-memory var
        if (!window.__lanyellDeviceId) window.__lanyellDeviceId = id;
        return window.__lanyellDeviceId;
      }
    }
    const deviceId = getDeviceId();

    // Paste button: try to read the clipboard programmatically. Reading is more
    // locked down than writing — on plain http (non-secure context) the clipboard
    // API is unavailable and execCommand("paste") is blocked by modern browsers,
    // so there is no reliable programmatic fallback. In that case we focus the
    // input and tell the user to paste manually, instead of silently doing nothing.
    const pasteBtn = document.getElementById("paste");
    pasteBtn.addEventListener("click", async function () {
      if (navigator.clipboard && navigator.clipboard.readText) {
        try {
          const text = await navigator.clipboard.readText();
          if (text) {
            input.value = text;
            autoGrow();
            input.focus();
          } else {
            input.focus();
            alert("Clipboard is empty");
          }
          return;
        } catch (err) {
          // readText can throw even on https if the user dismisses the prompt
          input.focus();
          alert("Could not read clipboard. Press Ctrl/Cmd+V to paste manually.");
          return;
        }
      }
      // Non-secure context (http LAN): no programmatic read possible
      input.focus();
      alert("Press Ctrl/Cmd+V (or long-press) to paste — browsers block apps from reading the clipboard over http.");
    });

    // Copy text: clipboard API needs a secure context (HTTPS/localhost); on LAN
    // http it is undefined, so fall back to execCommand (deprecated but the only
    // path that works over plain http).
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
        } catch (e) {
          reject(e);
        } finally {
          document.body.removeChild(ta);
        }
      });
    }

    // Render one message (textContent everywhere to prevent XSS)
    function render(msg) {
      const li = document.createElement("li");
      li.dataset.id = msg.id;
      li.style.background = msg.color || "#fff";
      const meta = document.createElement("div");
      meta.className = "meta";
      const time = document.createElement("span");
      time.className = "time";
      time.textContent = new Date(msg.time).toLocaleTimeString();
      const device = document.createElement("span");
      device.className = "device";
      device.textContent = msg.device;
      const copy = document.createElement("button");
      copy.className = "copy";
      copy.type = "button";
      copy.textContent = "Copy";
      copy.addEventListener("click", function () {
        copyText(msg.content).then(function () {
          copy.textContent = "✓ Copied";
          copy.classList.add("copied");
          setTimeout(function () {
            copy.textContent = "Copy";
            copy.classList.remove("copied");
          }, 1500);
        }).catch(function () {
          copy.textContent = "✗ Failed";
          copy.classList.add("failed");
          setTimeout(function () {
            copy.textContent = "Copy";
            copy.classList.remove("failed");
          }, 1500);
        });
      });
      const del = document.createElement("button");
      del.className = "delete";
      del.type = "button";
      del.textContent = "Delete";
      del.addEventListener("click", function () {
        fetch("/messages/" + encodeURIComponent(msg.id), { method: "DELETE" })
          .then(function (r) { if (!r.ok) throw new Error("delete failed"); })
          .catch(function () { alert("delete failed"); });
      });
      meta.appendChild(time);
      meta.appendChild(device);
      // right group: fold toggle (if overflowing) -> Copy -> Delete.
      // Wrapped in .btn-group so on phones the action buttons take their own
      // row below time/device. margin-left:auto on the group keeps it
      // right-aligned on desktop.
      const btnGroup = document.createElement("div");
      btnGroup.className = "btn-group";
      btnGroup.style.marginLeft = "auto";
      btnGroup.style.display = "flex";
      btnGroup.style.gap = "8px";
      btnGroup.style.alignItems = "center";
      const foldToggle = document.createElement("span");
      foldToggle.className = "fold-toggle";
      foldToggle.addEventListener("click", function () {
        const expanded = content.classList.toggle("expanded");
        foldToggle.textContent = expanded ? "collapse" : "expand";
        foldToggle.classList.toggle("collapsed", !expanded);
      });
      btnGroup.appendChild(foldToggle);
      btnGroup.appendChild(copy);
      btnGroup.appendChild(del);
      meta.appendChild(btnGroup);
      li.appendChild(meta);
      const content = document.createElement("span");
      content.className = "content collapsible";
      content.textContent = msg.content;
      li.appendChild(content);
      list.prepend(li); // newest on top
      // measure after insertion to decide whether the toggle should show
      applyFold(li);
    }

    // Remove a message element by id (called when a "delete" event arrives)
    function removeMessage(id) {
      const li = list.querySelector('li[data-id="' + CSS.escape(id) + '"]');
      if (li) li.remove();
    }

    // Fold switch state (persisted): when on, long messages clip at 200px.
    const FOLD_KEY = "lanyell_fold";
    let foldOn = true;
    try {
      const stored = localStorage.getItem(FOLD_KEY);
      if (stored !== null) foldOn = stored === "1";
    } catch (e) { /* localStorage unavailable: keep default */ }
    const foldSwitch = document.getElementById("foldSwitch");
    const FOLD_LIMIT = 222;

    // Apply/clear fold state on one item. In fold mode, only content whose
    // natural height exceeds the limit gets the .overflows class (which drives
    // the clip + overlay + toggle). Short content stays untouched.
    function applyFold(li) {
      const content = li.querySelector(".content");
      const toggle = li.querySelector(".fold-toggle");
      if (!content || !toggle) return;
      if (foldOn) {
        // measure the un-clipped height: strip both clip states first
        content.classList.remove("overflows", "expanded");
        toggle.classList.remove("collapsed");
        const fullHeight = content.scrollHeight;
        if (fullHeight > FOLD_LIMIT) {
          content.classList.add("overflows"); // clip applies via CSS
          toggle.classList.add("show", "collapsed"); // collapsed -> spinning border
          toggle.textContent = "expand";
        } else {
          toggle.classList.remove("show");
        }
      } else {
        // fold off: no clip, no toggle; make sure any prior clip is cleared
        content.classList.remove("overflows");
        content.classList.add("expanded");
        toggle.classList.remove("show", "collapsed");
      }
    }

    // Re-apply fold to every rendered item (called when the switch toggles)
    function applyFoldAll() {
      list.querySelectorAll("li").forEach(applyFold);
    }

    // Reflect the current state on the <body> class + the switch UI
    function syncFoldUi() {
      document.body.classList.toggle("fold-on", foldOn);
      foldSwitch.classList.toggle("on", foldOn);
    }

    // Persist + apply when the user flips the switch
    foldSwitch.addEventListener("click", function () {
      foldOn = !foldOn;
      try { localStorage.setItem(FOLD_KEY, foldOn ? "1" : "0"); } catch (e) { /* ignore */ }
      syncFoldUi();
      applyFoldAll();
    });

    // Initialize on load
    syncFoldUi();

    // SSE: stream events live (browser auto-reconnects).
    // Events are typed: "add" appends a message, "delete" removes one.
    const es = new EventSource("/events");
    es.onopen = function () { status.textContent = "connected"; };
    es.onerror = function () { status.textContent = "reconnecting…"; };
    es.onmessage = function (e) {
      const event = JSON.parse(e.data);
      if (event.type === "add") render(event.message);
      else if (event.type === "delete") removeMessage(event.id);
    };

    // Submit on Enter or button click
    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      const content = input.value.trim();
      if (!content) return;
      input.value = "";
      autoGrow(); // collapse height after clearing
      syncClearBtn(); // hide the clear button too
      input.disabled = true;
      try {
        const r = await fetch("/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: content, device: deviceId })
        });
        if (!r.ok) throw new Error((await r.json()).error || "send failed");
      } catch (err) {
        input.value = content;
        autoGrow();
        alert(err.message);
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
